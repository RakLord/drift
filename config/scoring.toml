# Drift scoring. Hot-reloaded by the viewer.
# Points accrue per second while drifting unless noted.

[drift]
start_angle_deg = 12.0        # drift starts above this angle...
min_speed_kmh = 25.0          # ...at or above this speed, moving forwards
end_angle_deg = 8.0           # drift ends after holding below this angle...
end_hold_secs = 0.3           # ...for this long (a transition passes through quickly)
spin_angle_deg = 100.0

[angle]
points_per_sec = 100.0
full_from_deg = 40.0          # full angle points between these angles
full_to_deg = 65.0
zero_at_deg = 100.0           # tapers to nothing at spin angle

[speed]
# Multiplier on everything earned while drifting.
slow_kmh = 30.0
slow_multiplier = 0.5
fast_kmh = 100.0
fast_multiplier = 1.5

[line]
clip_points = 500.0           # one-off per clip, scaled by proximity
clip_full_within = 0.5        # metres from the front bumper to the clip point
clip_zero_beyond = 4.0
clip_window_before = 15.0     # metres of track before the clip where approach counts
clip_window_after = 3.0
outer_points_per_sec = 300.0  # scaled by rear bumper proximity to the edge
outer_full_within = 0.5
outer_zero_beyond = 4.0

[style]
transition_points = 300.0
wall_tap_points = 400.0
wall_tap_min_speed = 0.3      # m/s into the wall, rear bumper, while drifting
wall_tap_max_speed = 3.0
wall_tap_cooldown_secs = 2.0  # at most one credited tap per this long...
max_taps_per_combo = 2        # ...and this many per combo
bobble_drop_deg = 12.0        # angle falling this far below its recent peak...
bobble_window_secs = 0.5      # ...then recovering within this time is a bobble
bobble_penalty = 100.0

[combo]
multiplier_step = 0.1         # per zone, transition or credited wall tap
multiplier_max = 3.0
spin_penalty = 500.0
hard_hit_speed = 3.5          # m/s into a wall: combo lost
hard_hit_penalty = 250.0
