# Training run settings. The trainer copies this (and the car, scoring and
# generator configs) into runs/<name>/config/ when a run starts.

seed = 1
generations = 500

[ga]
population = 100          # genomes per island
elite_fraction = 0.05
tournament_size = 4
crossover_rate = 0.7      # neuron-level crossover
mutation_rate = 0.05      # chance each parameter is nudged
sigma_start = 0.1         # mutation step size: start, limits, adaptation speed
sigma_min = 0.005
sigma_max = 0.5
sigma_adapt = 0.15
reset_rate = 0.002        # chance a parameter is re-drawn from scratch
immigrants = 2            # fresh random genomes per island per generation
migration_every = 25      # weakest island may be replaced by the strongest...
migration_gap = 0.8       # ...if its best is below this share of the strongest's
selection = "pareto"      # "pareto": rank over (driving, drift quality) so sliders survive; or "scalar"
reseed_fraction = 0.3     # on a stage change: sigma resets to sigma_start and this share
reseed_sigma = 0.3        # of each island becomes copies of its best, nudged by this much

# Starting priors for fresh networks. Neutral by default: new networks start
# out erratic and evolution has to find everything itself. A "calm start"
# alternative: output_bias = [0.0, 0.85, -3.0, -3.0, -3.0] (straight, ~70%
# throttle, brake/handbrake/clutch off) with output_init_scale = 0.25.
# Outputs: steer, throttle, brake, handbrake, clutch.
[network]
output_bias = [0.0, 0.85, -3.0, -1.5, -1.5]
output_init_scale = 0.25

# One island per network shape. Output heads are fixed (steer + 4 pedals).
[[islands]]
hidden = [{ size = 32, activation = "tanh" }, { size = 32, activation = "tanh" }]

[[islands]]
hidden = [{ size = 48, activation = "tanh" }]

[[islands]]
hidden = [{ size = 24, activation = "leaky_relu" }, { size = 24, activation = "leaky_relu" }]

[[islands]]
hidden = [{ size = 64, activation = "tanh" }, { size = 32, activation = "tanh" }]

[episode]
max_secs = 60.0
start_speed_kmh = 50.0    # rolling start, Formula Drift style
decision_every = 4        # network decides at 30 Hz, controls held in between
sensor_noise = 0.02
no_progress_secs = 4.0
max_backwards = 20.0
max_hard_hits = 3
end_on_spin = true
clutch_grace_secs = 0.4   # a clutch press shorter than this is a kick; longer is holding it
# Sawing: a control changing direction by `reversal` or more within
# `window_secs` of its last change of direction. Single swings (a lift, a
# counter-steer catch, a transition) don't count. Charged by `smoothness`.
smoothness = { throttle = { reversal = 0.2, window_secs = 0.3 }, steer = { reversal = 0.3, window_secs = 0.3 } }
# What the network's steer output means. "rate": how fast to turn the wheel,
# where full output goes lock to lock in `full_lock_secs` (the rack itself
# takes 0.33 s), so the wheel can't jitter. "position" (or leaving it out,
# as runs before run9 do): where the wheel should be, fresh every decision.
steering = { mode = "rate", full_lock_secs = 0.5 }

[tracks]
per_generation = 3        # fresh generated tracks every generation (config/generator.toml)
fixed = []              # saved tracks driven every generation too, e.g. ["tracks/generated_1.toml"]; left out of the test set
pool = ["tracks/skidpad.toml", "tracks/generated_9.toml", "tracks/generated_11.toml", "tracks/driftland.toml", "tracks/ebisu_kita.toml", "tracks/ebisu_minami.toml", "tracks/generated_1.toml", "tracks/meihan.toml", "tracks/nikko.toml"]                 # saved tracks to draw from, e.g. ["tracks/generated_9.toml", ...]; left out of the test set
pool_per_generation = 1   # pool tracks drawn each generation (also feeds the [best] check tracks)
test_every = 10           # best genome vs the library tracks (tracks/*.toml) every N gens; 0 = never

[checkpoints]
every = 10                # full population saved every N generations

# Which driver gets saved as best.genome (and judges curriculum advance and
# the test runs): the top `candidates` by fitness also drive `tracks` extra
# tracks (pool tracks it didn't drive this generation first, then generated
# ones), and the best over all its runs wins, so a lucky draw
# doesn't replace a steadier driver. 0 = just the generation's fittest.
[best]
candidates = 5
tracks = 6

# Every `every` generations the saved best is re-run with recording on each
# of that generation's tracks (~1-2 MB each), into runs/<run>/replays/.
# Watch them with `cargo run -p viewer -- --replays <run>`. 0 = off.
[replays]
every = 10

# The genomes `cargo run -p viewer -- --watch <run>` races together, written
# to runs/<run>/top.genomes every generation: the top `per_island` of each
# island by fitness, plus the `drifters` best by drift quality not already in.
[watch]
per_island = 5
drifters = 10

# Human picks from the review grid (`cargo run -p viewer -- --review <run>`).
# The trainer reads them at the end of each generation (runs/<run>/picks/).
# A pick is kept unchanged in its island for `protect_gens` generations
# (never bred out, and migration skips its island), and `flood_fraction` of
# the island is replaced by mutated children of it straight away (shared
# when one island gets several picks at once).
[review]
protect_gens = 50
flood_fraction = 0.3

# Curriculum. Per run:
#   driving = progress * metres (capped at progress_cap_laps) + time_alive * seconds
#   reward  = driving * (1 + drift_bonus * drift_quality)
#           + pedal_bonus * seconds on handbrake/clutch
#           + line/angle/style * judged points
#   fitness = reward * (1 - clutch.strength * clutch cost) - penalty * penalty points
#   (the drift_quality and judged parts are also x the smoothness factor)
# drift_quality is flow (config/scoring.toml [flow]): per second drifting, the
# angle points' shape (full at 40-65 degrees) x a hold credit that builds up
# the longer one side is held (0 -> 1 over ramp_secs, up to 1 + bonus). Linked
# transitions keep most of it; flicks start again. 1.0 = a full-angle drift,
# each side held past the ramp, the whole run. Pays from generation 0 whether
# or not combos get banked.
# clutch cost = share of the run holding the clutch past a kick
# ([episode] clutch_grace_secs), each second weighted from calm_weight at no
# angle up to 1 at 45 degrees or more. Never below 0; it also cuts the pareto
# objectives, so selection feels it. Leave `clutch` out for no penalty.
# smoothness factor = 1 - throttle * throttle saws/s - steer * steer saws/s,
# per second drifting ([episode] smoothness), never below 0. Cuts the drift and
# judged objectives, not driving. Steering is cheap on purpose: the car has no
# self-steer, so catching a slide takes real steering. For scale, run7's best
# at gen 3290 sawed ~0.8-2.5 throttle and ~7-16 steer times a second.
# Leave `smoothness` out for no penalty.
# Pareto selection ranks on three objectives: driving, drift_quality and the
# judged score (line/angle/style weighted, less penalty).
# `shaping` softens the rules while learning: drift counts from a few degrees,
# flat speed multiplier, spins don't end the run, no bobble penalty. The final
# stage has no shaping, so it's judged on the real config/scoring.toml.
# Moves on when the saved best genome's `metric`, averaged over the last
# `generations` generations of the stage, reaches `at_least` (a rolling mean:
# the value swings too much per generation for a streak to ever finish; the
# window starts empty on --resume). Keep penalty weights small: big penalties
# teach the cars that stopping is safest.
# `polish` (optional) fine-tunes a stage: smaller mutation steps, no random
# immigrants, more generated tracks per generation. Entering it (by advance
# or --stage) resets sigma to its sigma_start without reseeding. E.g.
#   polish = { sigma_start = 0.02, sigma_max = 0.1, immigrants = 0, tracks_per_generation = 8 }
# Usually on a last stage that a judged stage advances into.

[[curriculum]]
name = "drive"
progress = 1.0
drift_bonus = 1.0
line = 0.0
angle = 0.0
style = 0.0
penalty = 0.0
clutch = { strength = 2.0, calm_weight = 0.25 }
shaping = { drift_start_angle_deg = 5.0, speed_multiplier = 1.0, end_on_spin = false, bobble_penalty = 0.0 }
advance = { metric = "progress", at_least = 750.0, generations = 20 }

[[curriculum]]
name = "slide"
progress = 1.0
progress_cap_laps = 1.0
time_alive = 5.0
drift_bonus = 3.0
line = 0.0
angle = 0.0
style = 0.0
penalty = 0.0
clutch = { strength = 2.0, calm_weight = 0.25 }
smoothness = { throttle = 0.08, steer = 0.01 }  # half the judged weights: fresh networks saw a lot
shaping = { drift_start_angle_deg = 5.0, speed_multiplier = 1.0, end_on_spin = false, bobble_penalty = 0.0 }
advance = { metric = "drift_quality", at_least = 0.35, generations = 20 }  # flow

[[curriculum]]
name = "judged"
progress = 0.1
progress_cap_laps = 1.0
time_alive = 1.0
drift_bonus = 1.0
line = 1.0
angle = 1.0
style = 1.0
penalty = 0.5
clutch = { strength = 2.0, calm_weight = 0.25 }
smoothness = { throttle = 0.15, steer = 0.02 }  # run7's gen-3290 best would keep ~0.3-0.6
clips = { target = 0.6 }  # judged points x min(1, clip hit rate / target): run9 hit ~10-25% and straightened up at the clips
