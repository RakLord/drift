# Hand-built test course. Counter-clockwise loop, ~1.55 km.
# Each anchor starts the section that runs to the next one; left/right are
# relative to the driving direction. Handles are automatic (smooth).

version = 1
name = "Test Loop"
width = 13.0
verge = 8.0

[[anchors]]  # start: initiation straight
pos = [0.0, 0.0]
left = "soft"
right = "soft"

[[anchors]]
pos = [150.0, 0.0]
left = "soft"
right = "soft"

[[anchors]]  # big left sweeper, wall on the outside
pos = [235.0, 35.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [265.0, 115.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [230.0, 195.0]
left = "soft"
right = "hard"

[[anchors]]  # right-hand S, wall on the outside
pos = [160.0, 215.0]
left = "hard"
right = "soft"

[[anchors]]
pos = [110.0, 250.0]
left = "hard"
right = "soft"

[[anchors]]
pos = [120.0, 320.0]
left = "hard"
right = "soft"

[[anchors]]  # left hairpin, wall on the outside
pos = [185.0, 350.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [215.0, 410.0]
left = "soft"
right = "hard"

[[anchors]]  # flowing back section
pos = [170.0, 470.0]
left = "soft"
right = "soft"

[[anchors]]
pos = [80.0, 470.0]
left = "soft"
right = "soft"

[[anchors]]
pos = [20.0, 420.0]
left = "soft"
right = "soft"

[[anchors]]  # long left, wall on the outside
pos = [-30.0, 350.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [-90.0, 300.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [-140.0, 230.0]
left = "soft"
right = "soft"

[[anchors]]  # final left onto the straight
pos = [-110.0, 150.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [-60.0, 60.0]
left = "soft"
right = "soft"
