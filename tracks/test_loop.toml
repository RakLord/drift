# Hand-built test course. Counter-clockwise loop, ~1.55 km.
# Each anchor starts the section that runs to the next one; left/right are
# relative to the driving direction. Handles are automatic (smooth).

version = 1
name = "Test Loop"
width = 13.0
verge = 8.0

[[anchors]]  # start: initiation straight
pos = [0.0, 0.0]
left = "soft"
right = "soft"

[[anchors]]
pos = [150.0, 0.0]
left = "soft"
right = "soft"

[[anchors]]  # big left sweeper, wall on the outside
pos = [235.0, 35.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [265.0, 115.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [230.0, 195.0]
left = "soft"
right = "hard"

[[anchors]]  # right-hand S, wall on the outside
pos = [160.0, 215.0]
left = "hard"
right = "soft"

[[anchors]]
pos = [110.0, 250.0]
left = "hard"
right = "soft"

[[anchors]]
pos = [120.0, 320.0]
left = "hard"
right = "soft"

[[anchors]]  # left hairpin, wall on the outside
pos = [185.0, 350.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [215.0, 410.0]
left = "soft"
right = "hard"

[[anchors]]  # flowing back section
pos = [170.0, 470.0]
left = "soft"
right = "soft"

[[anchors]]
pos = [80.0, 470.0]
left = "soft"
right = "soft"

[[anchors]]
pos = [20.0, 420.0]
left = "soft"
right = "soft"

[[anchors]]  # long left, wall on the outside
pos = [-30.0, 350.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [-90.0, 300.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [-140.0, 230.0]
left = "soft"
right = "soft"

[[anchors]]  # final left onto the straight
pos = [-110.0, 150.0]
left = "soft"
right = "hard"

[[anchors]]
pos = [-60.0, 60.0]
left = "soft"
right = "soft"
# Judged zones. Positions are section coordinates (anchor index + fraction).
# Clips are judged on the front bumper, outer zones on the rear bumper.

[[zones]]  # big left sweeper
kind = "clip"
at = 3.0
side = "left"

[[zones]]
kind = "outer"
from = 2.3
to = 3.9
side = "right"

[[zones]]  # right-hand S
kind = "clip"
at = 6.0
side = "right"

[[zones]]
kind = "outer"
from = 5.4
to = 6.8
side = "left"

[[zones]]  # left hairpin
kind = "clip"
at = 9.0
side = "left"

[[zones]]
kind = "outer"
from = 8.3
to = 9.8
side = "right"

[[zones]]  # long left
kind = "clip"
at = 14.0
side = "left"

[[zones]]
kind = "outer"
from = 13.2
to = 14.9
side = "right"

[[zones]]  # final left onto the straight
kind = "clip"
at = 16.6
side = "left"
