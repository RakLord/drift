[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
common = { path = "crates/common" }
sim = { path = "crates/sim" }
nn = { path = "crates/nn" }
agent = { path = "crates/agent" }
evo = { path = "crates/evo" }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
macroquad = { version = "0.4", default-features = false }
gilrs = "0.11"
rayon = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The sim is far too slow unoptimised; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
